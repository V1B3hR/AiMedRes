name: Continuous Integration & Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    name: Unit Tests & Leakage Prevention
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-ml.txt
          pip install -r requirements-dev.txt

      - name: Run Unit Tests (Scientific, Security & Service Domains)
        run: |
          pytest tests/unit/ -v --durations=10

      - name: Execute PPMI Parkinson's Reproducibility Benchmark
        run: |
          python scripts/reproduce_ppmi_benchmark.py

      - name: Generate CycloneDX SBOM (Phase 3.4)
        run: |
          python scripts/generate_sbom.py

      - name: Archive SBOM and Benchmark Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-artifacts
          path: |
            reports/sbom.json
            results/ppmi_reproducibility_benchmark/
